name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (includes Flyway migrations on MySQL via Testcontainers)
        run: ./mvnw -B verify

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Docker images + end-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-db-password
      EMS_INITIAL_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the backend to be ready
        run: curl --fail --silent --retry 40 --retry-delay 3 --retry-all-errors http://localhost:8080/actuator/health/readiness
      - name: Smoke test through the frontend's /api proxy
        run: |
          curl --fail --silent -u superadmin:$EMS_INITIAL_ADMIN_PASSWORD -X POST http://localhost:3000/api/auth/login | grep -q '"role":"SUPERADMIN"'
          curl --fail --silent http://localhost:3000/expenses | grep -q '<div id="root">'
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests (real browser against the running stack)
        working-directory: e2e
        run: npx playwright test
        env:
          E2E_ADMIN_PASSWORD: ${{ env.EMS_INITIAL_ADMIN_PASSWORD }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      # Pushing images to Amazon ECR and deploying to EKS is handled by the DevOps team.
