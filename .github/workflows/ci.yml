name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test (includes Flyway migrations on MySQL via Testcontainers)
        run: ./mvnw -B verify

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true

  smoke:
    name: Docker images + smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-db-password
      EMS_INITIAL_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the backend to be ready
        run: curl --fail --silent --retry 40 --retry-delay 3 --retry-all-errors http://localhost:8080/actuator/health/readiness
      - name: Log in through the frontend's /api proxy
        run: |
          curl --fail --silent -u superadmin:$EMS_INITIAL_ADMIN_PASSWORD -X POST http://localhost:3000/api/auth/login | tee /dev/stderr | grep -q '"role":"SUPERADMIN"'
          curl --fail --silent http://localhost:3000/expenses | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      # Pushing images to Amazon ECR and deploying to EKS is handled by the DevOps team.
