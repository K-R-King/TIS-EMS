# Render Blueprint for the free demo backend (Render dashboard -> New -> Blueprint -> pick this repo).
# The database is external (e.g. Aiven free MySQL); fill in the values marked sync: false when prompted.
services:
  - type: web
    name: tis-ems-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false   # jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: EMS_INITIAL_ADMIN_PASSWORD
        sync: false   # password for the first 'superadmin' login
      - key: EMS_ALLOWED_ORIGINS
        sync: false   # the Vercel address, e.g. https://tis-ems.vercel.app
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError
