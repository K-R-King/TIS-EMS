# Runs the whole stack locally, the same way it runs in production:
#   DB_PASSWORD=choose-one EMS_INITIAL_ADMIN_PASSWORD=choose-another docker compose up --build
# App: http://localhost:3000 (nginx serves the UI and forwards /api to the backend)
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mydatabase
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change-me}"]
      interval: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/mydatabase
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      EMS_ALLOWED_ORIGINS: http://localhost:3000
      EMS_INITIAL_ADMIN_PASSWORD: ${EMS_INITIAL_ADMIN_PASSWORD:?Set EMS_INITIAL_ADMIN_PASSWORD (password for the first superadmin login)}
    ports:
      - "8080:8080" # only needed for health checks/debugging; the UI goes through nginx
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  db-data:
