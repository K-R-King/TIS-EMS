# Settings for deployed environments: SPRING_PROFILES_ACTIVE=prod

# JSON logs, one event per line (for CloudWatch or any log collector)
logging.structured.format.console=ecs

# Served over HTTPS behind a load balancer or proxy
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

# API documentation is for development; not served in deployed environments
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# On an empty database, refuse to start without EMS_INITIAL_ADMIN_PASSWORD rather than log a generated password
ems.require-initial-admin-password=true
