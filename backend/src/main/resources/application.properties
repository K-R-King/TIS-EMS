spring.application.name=EMS
server.port=${PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydatabase}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema changes go through Flyway migrations in db/migration; Hibernate only checks the schema matches.
# Databases created by older versions of the app (before Flyway) are treated as already at V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Receipts (PDF/JPG/PNG), stored in the database
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Login sessions are stored in the database so any app instance can serve any request
spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Health checks for Kubernetes: /actuator/health/liveness and /actuator/health/readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Comma-separated list of frontend origins allowed to call the API
ems.cors.allowed-origins=${EMS_ALLOWED_ORIGINS:http://localhost:3000}

# "Today" and "this month" for expense dates follow this time zone
ems.time-zone=${EMS_TIME_ZONE:Asia/Kolkata}

# Lock an account for a while after this many wrong passwords in a row
ems.security.max-failed-logins=5
ems.security.lock-minutes=15

# Password for the 'superadmin' account created when the users table is empty (random if unset)
ems.initial-admin-password=${EMS_INITIAL_ADMIN_PASSWORD:}
