spring.datasource.url=jdbc:h2:mem:ems;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Fast tests use H2 with a Hibernate-generated schema; MigrationTests checks the real Flyway scripts on MySQL
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.session.jdbc.initialize-schema=always
ems.cors.allowed-origins=http://localhost:3000
ems.initial-admin-password=
ems.time-zone=Asia/Kolkata
ems.security.max-failed-logins=5
ems.security.lock-minutes=15
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
